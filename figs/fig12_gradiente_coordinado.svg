<text x="230.0" y="297.0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">u</text>
<text x="230.0" y="48.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1F4E79" text-anchor="middle" xml:space="preserve"><tspan>se actualiza solo la fila F</tspan><tspan dy="4.5" font-size="12.2">u</tspan></text>
<text x="230.0" y="535.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#404040" text-anchor="middle">vecinos N(u) en azul; no vecinos en gris</text>
<rect x="480.0" y="30.0" width="720.0" height="92.0" rx="10" fill="#F2F2F2" stroke="#808080" stroke-width="1.5"/>
<text x="840.0" y="68.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1F4E79" text-anchor="middle" xml:space="preserve"><tspan>∇l(F</tspan><tspan dy="4.8" font-size="12.9">u</tspan><tspan dy="-4.8">) = Σ</tspan><tspan dy="4.8" font-size="12.9">v ∈ N(u)</tspan><tspan dy="-4.8"> F</tspan><tspan dy="4.8" font-size="12.9">v</tspan><tspan dy="-4.8"> · exp(−F</tspan><tspan dy="4.8" font-size="12.9">u</tspan><tspan dy="-4.8">·F</tspan><tspan dy="4.8" font-size="12.9">v</tspan><tspan dy="-4.8">) / (1 − exp(−F</tspan><tspan dy="4.8" font-size="12.9">u</tspan><tspan dy="-4.8">·F</tspan><tspan dy="4.8" font-size="12.9">v</tspan><tspan dy="-4.8">))  −  Σ</tspan><tspan dy="4.8" font-size="12.9">v ∉ N(u)</tspan><tspan dy="-4.8"> F</tspan><tspan dy="4.8" font-size="12.9">v</tspan></text>
<text x="840.0" y="104.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#404040" text-anchor="middle" xml:space="preserve"><tspan>con las F</tspan><tspan dy="3.8" font-size="10.2">v</tspan><tspan dy="-3.8"> fijas, el subproblema en F</tspan><tspan dy="3.8" font-size="10.2">u</tspan><tspan dy="-3.8"> es cóncavo</tspan></text>
<circle cx="510.0" cy="178.0" r="18.0" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/>
<text x="510.0" y="185.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="545.0" y="172.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1F4E79" text-anchor="start">Gradiente en O(grado de u)</text>
<text x="545.0" y="204.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#404040" text-anchor="start" xml:space="preserve"><tspan>Σ</tspan><tspan dy="4.0" font-size="10.9">v ∉ N(u)</tspan><tspan dy="-4.0"> F</tspan><tspan dy="4.0" font-size="10.9">v</tspan><tspan dy="-4.0"> = S − F</tspan><tspan dy="4.0" font-size="10.9">u</tspan><tspan dy="-4.0"> − Σ</tspan><tspan dy="4.0" font-size="10.9">v ∈ N(u)</tspan><tspan dy="-4.0"> F</tspan><tspan dy="4.0" font-size="10.9">v</tspan><tspan dy="-4.0">,  con S = Σ</tspan><tspan dy="4.0" font-size="10.9">v</tspan><tspan dy="-4.0"> F</tspan><tspan dy="4.0" font-size="10.9">v</tspan><tspan dy="-4.0"> en memoria</tspan></text>
<circle cx="510.0" cy="276.0" r="18.0" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/>
<text x="510.0" y="283.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="545.0" y="270.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1F4E79" text-anchor="start">Paso con búsqueda lineal</text>
<text x="545.0" y="302.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#404040" text-anchor="start" xml:space="preserve"><tspan>F</tspan><tspan dy="4.0" font-size="10.9">u</tspan><tspan dy="-4.0"> ← F</tspan><tspan dy="4.0" font-size="10.9">u</tspan><tspan dy="-4.0"> + t ∇l(F</tspan><tspan dy="4.0" font-size="10.9">u</tspan><tspan dy="-4.0">), reduciendo t hasta cumplir Armijo</tspan></text>
<circle cx="510.0" cy="374.0" r="18.0" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/>
<text x="510.0" y="381.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="545.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1F4E79" text-anchor="start">Proyección</text>
<text x="545.0" y="400.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#404040" text-anchor="start" xml:space="preserve"><tspan>F</tspan><tspan dy="4.0" font-size="10.9">uc</tspan><tspan dy="-4.0"> ← max(0, F</tspan><tspan dy="4.0" font-size="10.9">uc</tspan><tspan dy="-4.0">): las membresías no pueden ser negativas</tspan></text>
<circle cx="510.0" cy="472.0" r="18.0" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/>
<text x="510.0" y="479.0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="545.0" y="466.0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#1F4E79" text-anchor="start">Actualizar la suma y seguir</text>
<text x="545.0" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#404040" text-anchor="start" xml:space="preserve"><tspan>S ← S + F</tspan><tspan dy="4.0" font-size="10.9">u</tspan><tspan dy="-4.0"> nuevo − F</tspan><tspan dy="4.0" font-size="10.9">u</tspan><tspan dy="-4.0"> viejo; pasar al siguiente nodo</tspan></text>
<text x="840.0" y="555.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#548235" text-anchor="middle">Una iteración recorre todos los nodos; se detiene cuando l(F) mejora menos de 0.001 %</text>
</svg>
