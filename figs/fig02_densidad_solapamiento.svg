<text x="792.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">Grafo AGM con 600 nodos y 6 comunidades</text>
<text x="792.0" y="150.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">p = 0.08 en cada comunidad y ε = 0.002</text>
<text x="792.0" y="177.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start"></text>
<text x="792.0" y="204.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">Compartir dos comunidades casi</text>
<text x="792.0" y="231.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">duplica la probabilidad de arista.</text>
<text x="792.0" y="258.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start"></text>
<text x="792.0" y="285.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">Yang y Leskovec (2012) observan lo</text>
<text x="792.0" y="312.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">mismo en LiveJournal, Orkut, Amazon,</text>
<text x="792.0" y="339.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">DBLP y Friendster: la probabilidad</text>
<text x="792.0" y="366.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">crece con cada comunidad compartida.</text>
<text x="792.0" y="393.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start"></text>
<text x="792.0" y="420.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">Los métodos de partición asumen lo</text>
<text x="792.0" y="447.9" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" fill="#404040" text-anchor="start">contrario: el solape sería poco denso.</text>
